services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: /api
        VITE_ENABLE_DEV_TOOLS: "false"
    ports:
      - "80:80"
    volumes:
      - staticfiles:/staticfiles:ro
      - media:/media:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env.production
    environment:
      RUN_STARTUP_TASKS: "true"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/matches/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env.production
    environment:
      ENABLE_SYNC_SCHEDULER: "true"
    command: ["python", "manage.py", "run_sync_scheduler"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-matchnote}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-matchnote123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
  staticfiles:
  media:
